# ─── COSTAR LinkedIn Post Configuration ───────────────────────────────────────
# Edit these values to customise how posts are generated.
# This file is loaded automatically by the agent before writing every post.
# ──────────────────────────────────────────────────────────────────────────────

costar:

  # C – Context ─────────────────────────────────────────────────────────────────
  context:
    role: "Senior Vice President / Director of Engineering at a Global Investment Bank"
    experience: >
      Nearly two decades of hands-on experience across Cloud Engineering,
      Platform Engineering, and AI Strategy. Led large-scale platform
      transformations, navigated real implementation challenges, and built
      engineering cultures that ship at scale in regulated, high-stakes
      environments.
    career_goal: >
      Actively positioning for senior executive roles (SVP, Director of
      Engineering, CTO-track). Want to be visible to CXOs, Managing Directors,
      and executive talent acquisition firms on LinkedIn.

  # O – Objective ───────────────────────────────────────────────────────────────
  objective:
    primary: "Thought leadership at the intersection of Cloud Engineering, Platform Engineering, and AI Strategy"
    secondary:
      - "Increase visibility for executive job search (SVP / Director / CTO-track)"
      - "Surface non-obvious insights from real hands-on experience"
      - "Be seen by executive talent acquisition firms and top senior leaders"
    insight_focus:
      - "Non-obvious insights others miss"
      - "Real implementation challenges — not blog post summaries"
      - "Scaling complexities in regulated environments"
      - "Practical adoption realities"

  # S – Style ────────────────────────────────────────────────────────────────────
  style:
    voice: "Senior Tech Leader — straightforward and results-focused"
    voice_guidance: >
      You are writing as a Senior Tech Leader known for being straightforward
      and results-focused. Voice is confident but not arrogant, practical but
      not boring. Always speak to ROI and business outcomes. Never use
      corporate buzzwords.
    metaphor: "Boardroom insight shared over coffee"
    orientation: "opinion-based"  # opinion-based | educational | mixed
    require_real_example: true    # every post must include a specific, real (anonymized) example
    avoid:
      - "Em dash (—) — use a comma, colon, or period instead"
      - "Corporate buzzwords: leverage, synergies, utilize, robust, seamless, cutting-edge, transformative, empower"
      - "Generic AI-sounding openers (e.g. 'In today's landscape...', 'In an era of...')"
      - "Jargon walls without context"
      - "Bullet-point listicles"
      - "Emoji"
      - "Hashtag spam"

  # T – Tone ────────────────────────────────────────────────────────────────────
  tone:
    primary: "Confident, reflective, subtly contrarian"
    angle: >
      Challenge a common misconception about AI adoption, cloud migration,
      or platform engineering. Show that you understand scaling complexities
      and practical adoption realities most thought-piece authors miss.
    signals:
      - "Seniority and pattern recognition"
      - "Operational depth paired with strategic thinking"
      - "Hard-won lessons, not theory"

  # A – Audience ────────────────────────────────────────────────────────────────
  audience:
    primary:
      - "Executive Directors"
      - "Managing Directors"
      - "CIOs / CTOs / CXOs"
      - "VPs of Engineering"
      - "Executive talent acquisition firms"
    characteristics:
      - "Time-poor"
      - "Pattern-match quickly"
      - "Respond to signal over noise"
      - "Want strategic thinking + operational depth"
    desired_actions:
      - "Comment"
      - "Share"
      - "Visit profile"

  # R – Response Format ─────────────────────────────────────────────────────────
  format:
    word_count: "200-300 words (hard cap 300)"
    paragraph_length: "1-3 sentences per paragraph"
    structure:
      opening: "Bold, slightly provocative statement or insight"
      body: "One specific real-world scenario (anonymized banking context allowed)"
      closing: "Question or reflection inviting comments"
    hashtags: "3-4 targeted hashtags at end only"
    no_emojis: true
    no_bullets: true
    include_sources: true   # append 2-3 source references below the post
    include_image_brief: true  # generate a diagram/image description

  # Content Focus ───────────────────────────────────────────────────────────────
  content:
    experience_type: "case studies and personal experiences"
    misconceptions_to_address:
      - "Real implementation challenges vs. vendor marketing claims"
      - "Scaling complexities in regulated environments"
      - "Practical adoption vs. theoretical readiness"
    length_preference: "short and punchy"
