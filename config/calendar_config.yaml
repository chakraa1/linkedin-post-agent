# ─── Content Calendar Configuration ──────────────────────────────────────────
# Generated by: python main.py setup
# Edit directly or re-run setup to reconfigure.
# ──────────────────────────────────────────────────────────────────────────────

calendar:
  # 1_week | 1_month | 3_months | custom
  period: "1_week"

  # How many posts per week (1–5)
  posts_per_week: 5

  # Which weekdays to post (Monday=0 … Friday=4)
  posting_days: [0, 1, 2, 3, 4]  # Mon / Tue / Wed / Thu / Fri

  schedule:
    time: "17:30"                 # 24h HH:MM
    timezone: "Asia/Kolkata"      # IST — change to "US/Eastern", "Europe/London" etc.

  # review   → show each post before scheduling/publishing
  # autopilot → generate & schedule without human review
  mode: "review"

  # Generate only the FIRST post (Week 1 Day 1) for style review before
  # generating the full calendar. Set to false to skip the preview step.
  preview_first: false

  # Whether to automatically post to LinkedIn after scheduling.
  # Default: false — user must explicitly approve each post.
  auto_post_to_linkedin: false

  # Series mode: generate 2-3 sequential posts on the same topic (a mini-series)
  # When enabled, all slots in a week cover ONE topic from different angles.
  series_mode:
    enabled: true
    posts_per_series: 5      # 2, 3, or 5

  # LinkedIn optimal posting times (IST — adjust for your timezone)
  # primary:   12:30 PM — peak lunch-hour LinkedIn engagement
  # secondary: 18:30 PM — evening engagement window
  posting_times:
    primary:   "12:30"
    secondary: "18:30"

# ─── Image Generation ─────────────────────────────────────────────────────────
image:
  enabled: true

  # openai (DALL-E 3) | stability (Stable Diffusion 3) | replicate (Flux Pro) | none
  provider: "openai"

  openai:
    model: "dall-e-3"
    size: "1792x1024"             # landscape — best for LinkedIn
    quality: "hd"                 # standard | hd

  stability:
    model: "sd3-large"
    aspect_ratio: "16:9"

  replicate:
    model: "black-forest-labs/flux-pro"

  # Style guidance injected into every image prompt to avoid AI-looking output
  style_guidance: >
    Professional editorial photograph. Shot on Sony A7R IV, 35mm f/1.8 lens.
    Cinematic colour grading. Natural or controlled studio lighting.
    Shallow depth of field. Modern tech office or data-centre environment.
    No text, no watermarks, no UI overlays. Not a stock photo. Photorealistic.

# ─── Output ───────────────────────────────────────────────────────────────────
output:
  save_calendar_json: true        # persist full calendar to outputs/calendar_*.json
  images_dir: "outputs/images"    # where generated images are saved
  posts_dir: "outputs/posts"      # individual post markdown files
